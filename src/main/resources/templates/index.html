<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Mock Exam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            margin: 50px auto;
            max-width: 800px;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            color: white;
            padding: 40px;
            text-align: center;
        }
        .stats-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin: 15px 0;
            transition: transform 0.3s ease;
        }
        .stats-card:hover {
            transform: translateY(-5px);
        }
        .btn-custom {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 25px;
            color: white;
            padding: 12px 30px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            color: white;
        }
        .config-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin: 20px;
        }
        .icon {
            font-size: 2rem;
            margin-bottom: 15px;
        }
        .category-btn {
            background: #e9ecef;
            border: 1px solid #dee2e6;
            border-radius: 15px;
            padding: 4px 8px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 2px;
        }
        .category-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-1px);
        }
        .category-btn.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-container">
            <div class="header">
                <i class="fas fa-graduation-cap fa-3x mb-3"></i>
                <h1 class="display-4 fw-bold">Java Certification Mock Exam</h1>
                <p class="lead">Test your Java knowledge with our comprehensive question bank</p>
            </div>

            <div class="config-section">
                <h3 class="text-center mb-4"><i class="fas fa-cog"></i> Configure Your Exam</h3>
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Number of Questions</label>
                            <div class="form-control bg-light">50 Questions (Fixed)</div>
                            <input type="hidden" id="questionCount" value="50">
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="category" class="form-label fw-bold">Topic Selection</label>
                            <input type="text" class="form-control" id="category" 
                                   placeholder="Type topics you want to study or click suggestions below" 
                                   title="Example: OOP Concepts, Java Fundamentals, Data Types">
                            <small class="form-text text-muted">Separate multiple topics with commas, or leave empty for all topics</small>
                            
                            <!-- Quick selection buttons -->
                            <div class="mt-2">
                                <small class="text-muted d-block mb-1">Quick select:</small>
                                <div id="categoryButtons" class="d-flex flex-wrap gap-1">
                                    <!-- Category buttons will be loaded here -->
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Options</label>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="randomize" checked>
                                <label class="form-check-label" for="randomize">
                                    Randomize Questions
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <button class="btn btn-custom btn-lg" onclick="startExam()">
                        <i class="fas fa-play"></i> Start Exam
                    </button>
                </div>
            </div>

            <div class="row" id="statsContainer">
                <!-- Stats will be loaded here -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Load exam statistics on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadExamStats();
            loadCategoryButtons();
        });

        async function loadExamStats() {
            try {
                const response = await fetch('/api/exam/stats');
                const stats = await response.json();
                
                const statsHtml = `
                    <div class="col-md-6">
                        <div class="stats-card text-center">
                            <i class="fas fa-question-circle icon text-primary"></i>
                            <h4>${stats.totalQuestions}</h4>
                            <p class="text-muted">Total Questions</p>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="stats-card text-center">
                            <i class="fas fa-tags icon text-success"></i>
                            <h4>${stats.categories.length}</h4>
                            <p class="text-muted">Categories</p>
                        </div>
                    </div>
                `;
                
                document.getElementById('statsContainer').innerHTML = statsHtml;
                
                // Also populate category breakdown
                const categoryBreakdown = stats.categories.map(cat => 
                    `<span class="badge bg-secondary me-1">${cat}: ${stats.categoryCount[cat] || 0}</span>`
                ).join(' ');
                
                if (categoryBreakdown) {
                    const breakdownHtml = `
                        <div class="col-12">
                            <div class="stats-card">
                                <h6 class="fw-bold mb-2">Questions by Category:</h6>
                                ${categoryBreakdown}
                            </div>
                        </div>
                    `;
                    document.getElementById('statsContainer').innerHTML += breakdownHtml;
                }
                
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        async function loadCategoryButtons() {
            try {
                const response = await fetch('/api/exam/categories');
                const categories = await response.json();
                
                const buttonContainer = document.getElementById('categoryButtons');
                categories.forEach(cat => {
                    const button = document.createElement('span');
                    button.className = 'category-btn';
                    button.textContent = cat;
                    button.onclick = () => toggleCategory(cat, button);
                    buttonContainer.appendChild(button);
                });
            } catch (error) {
                console.error('Error loading categories:', error);
            }
        }

        function toggleCategory(categoryName, buttonElement) {
            const categoryInput = document.getElementById('category');
            const currentValue = categoryInput.value;
            const categories = currentValue ? currentValue.split(',').map(c => c.trim()).filter(c => c) : [];
            
            if (categories.includes(categoryName)) {
                // Remove category
                const newCategories = categories.filter(c => c !== categoryName);
                categoryInput.value = newCategories.join(', ');
                buttonElement.classList.remove('selected');
            } else {
                // Add category
                categories.push(categoryName);
                categoryInput.value = categories.join(', ');
                buttonElement.classList.add('selected');
            }
        }

        function startExam() {
            const count = document.getElementById('questionCount').value;
            const category = document.getElementById('category').value;
            const randomize = document.getElementById('randomize').checked;
            
            // Build query parameters
            const params = new URLSearchParams({
                count: count,
                randomize: randomize
            });
            
            if (category) params.append('category', category);
            
            // Redirect to exam page with parameters
            window.location.href = `/exam?${params.toString()}`;
        }
    </script>
</body>
</html>
